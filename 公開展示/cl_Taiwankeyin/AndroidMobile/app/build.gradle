plugins {
    id 'com.android.application'
}

android {
    namespace 'tw.cell.taiwankeyin'
    compileSdk 35

    defaultConfig {
        applicationId 'tw.cell.taiwankeyin'
        minSdk 26
        targetSdk 35
        versionCode 102
        versionName '1.0.2-unified'
        manifestPlaceholders = [imeLabel: 'CELL 臺灣注音']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        // CI test signing keys change between runs; side-by-side identity protects
        // the installed alpha1 user database instead of forcing an uninstall.
        debug {
            
            
            manifestPlaceholders = [imeLabel: 'CELL 臺灣注音']
        }
        release { minifyEnabled false }
        sidecar {
            initWith release
            applicationIdSuffix '.paste'
            versionNameSuffix '-sidecar'
            manifestPlaceholders = [imeLabel: 'CELL 臺灣注音（貼上測試）']
        }
    }
}
