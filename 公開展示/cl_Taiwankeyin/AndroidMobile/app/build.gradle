plugins {
    id 'com.android.application'
}

android {
    namespace 'tw.cell.taiwankeyin'
    compileSdk 35

    defaultConfig {
        applicationId 'tw.cell.taiwankeyin'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.1.3-alpha4'
        manifestPlaceholders = [imeLabel: 'CELL 臺灣注音']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        // CI test signing keys change between runs; side-by-side identity protects
        // the installed alpha1 user database instead of forcing an uninstall.
        debug {
            applicationIdSuffix '.alpha4test'
            versionNameSuffix '-test'
            manifestPlaceholders = [imeLabel: 'CELL 臺灣注音 Alpha4 測試']
        }
        release { minifyEnabled false }
    }
}
