plugins {
    id 'com.android.application'
}

android {
    namespace 'tw.cell.taiwankeyin'
    compileSdk 35

    defaultConfig {
        applicationId 'tw.cell.taiwankeyin'
        minSdk 26
        targetSdk 35
        versionCode 100
        versionName '1.0.0-unified'
        manifestPlaceholders = [imeLabel: 'CELL 臺灣注音']
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        // Both build types share the canonical package ID. Android upgrades
        // require an identical signing certificate as well as this ID.
        debug {
            manifestPlaceholders = [imeLabel: 'CELL 臺灣注音']
        }
        release {
            minifyEnabled false
            manifestPlaceholders = [imeLabel: 'CELL 臺灣注音']
        }
    }
}
