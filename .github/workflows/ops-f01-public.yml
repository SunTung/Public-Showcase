name: OPS-F01 public incremental corpus
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ops-f01-public.yml'
      - 'OPS-F01-English-Corpus/collect.py'
      - 'OPS-F01-English-Corpus/catalog.py'
      - 'OPS-F01-English-Corpus/audit.py'
      - 'OPS-F01-English-Corpus/collect_technical.py'
      - 'OPS-F01-English-Corpus/category_report.py'
permissions:
  contents: write
concurrency:
  group: ops-f01-public
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check collector syntax
        run: python -m py_compile OPS-F01-English-Corpus/collect.py OPS-F01-English-Corpus/catalog.py OPS-F01-English-Corpus/audit.py OPS-F01-English-Corpus/collect_technical.py OPS-F01-English-Corpus/category_report.py
      - name: Download up to three bounded public-domain texts
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "OPS-F01 bounded attempt $i / 3"
            if ! python OPS-F01-English-Corpus/collect.py; then
              echo "OPS-F01 attempt $i failed; continuing to next source"
            fi
          done
      - name: Collect bounded technical documentation candidates
        run: python OPS-F01-English-Corpus/collect_technical.py
      - name: Verify downloaded files against candidate ledger
        run: python OPS-F01-English-Corpus/audit.py
      - name: Produce category coverage report
        run: python OPS-F01-English-Corpus/category_report.py
      - name: Commit candidate and ledger
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add OPS-F01-English-Corpus/corpus OPS-F01-English-Corpus/indexes/ledger.json OPS-F01-English-Corpus/reports/category_status.json
          if ! git diff --cached --quiet; then
            git commit -m "OPS-F01 public candidate increment"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
