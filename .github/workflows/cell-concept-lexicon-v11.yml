name: CELL Lexicon v1.1 independent CI
on:
  push:
    paths:
      - "公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v1_1/**"
      - ".github/workflows/cell-concept-lexicon-v11.yml"
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install openpyxl
      - name: Test complete baseline and v1.1
        working-directory: 公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v1_1
        run: |
          python src/build_v08.py
          python -m unittest discover -s tests -q
          python src/batch_intake_v11.py build/cell_concepts.sqlite3 build/EXAMPLE_ONLY_not_official.tsv build/ci_fixture_result.json --name "TEST FIXTURE" --version "fixture" --source-url https://example.org/fixture
