name: CELL TaiwanKeyin Android emulator smoke

on:
  push:
    branches: [main]
    paths:
      - '公開展示/cl_Taiwankeyin/AndroidMobile/**'
      - '.github/workflows/cell-taiwankeyin-android-emulator.yml'
  workflow_dispatch:

jobs:
  android-real-editor-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test JVM core and build debug APK
        run: |
          bash '公開展示/cl_Taiwankeyin/AndroidMobile/tests/run_java_tests.sh'
          cd '公開展示/cl_Taiwankeyin/AndroidMobile'
          gradle --no-daemon :app:assembleDebug
      - name: Enable KVM permissions for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Android 35 EditText and SQLite integration smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash '公開展示/cl_Taiwankeyin/AndroidMobile/tests/android_emulator_smoke.sh'
