name: CELL TaiwanKeyin Windows graphical preview EXE
on:
  push:
    branches: [main]
    paths:
      - '公開展示/cl_Taiwankeyin/WindowsDesktop_v02/**'
      - '.github/workflows/cell-taiwankeyin-windows-preview.yml'
  workflow_dispatch:
jobs:
  windows-app:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned OpenCC and PyInstaller
        run: python -m pip install opencc==1.4.2 pyinstaller==6.16.0
      - name: Generate verified full Taiwan lexicon from pinned sources
        shell: pwsh
        run: |
          python '公開展示/cl_Taiwankeyin/AndroidMobile/tools/stage_verified_full_lexicon.py' --download --source-dir "$env:RUNNER_TEMP\chewing" --output '公開展示/cl_Taiwankeyin/WindowsDesktop_v02/full_zhuyin_mobile.sqlite3'
      - name: Windows desktop engine test using full corpus
        working-directory: '公開展示/cl_Taiwankeyin/WindowsDesktop_v02'
        shell: pwsh
        run: |
          $env:CELL_LEXICON = (Resolve-Path "full_zhuyin_mobile.sqlite3").Path
          python -m unittest discover -p test_engine.py -v
      - name: Package native Windows executable and offline lexicon
        working-directory: '公開展示/cl_Taiwankeyin/WindowsDesktop_v02'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --windowed --onedir --clean --name CELL_TaiwanKeyin_WinPreview --add-data "full_zhuyin_mobile.sqlite3;." app.py
          if (!(Test-Path "dist/CELL_TaiwanKeyin_WinPreview/CELL_TaiwanKeyin_WinPreview.exe")) { throw "EXE missing" }
          $head = [IO.File]::ReadAllBytes("dist/CELL_TaiwanKeyin_WinPreview/CELL_TaiwanKeyin_WinPreview.exe")
          if ($head[0] -ne 77 -or $head[1] -ne 90) { throw "Invalid Win32 PE executable" }
      - name: Publish ready-to-extract Windows folder
        uses: actions/upload-artifact@v4
        with:
          name: CELL_TaiwanKeyin_Windows_v0.2_DesktopPreview
          path: '公開展示/cl_Taiwankeyin/WindowsDesktop_v02/dist/CELL_TaiwanKeyin_WinPreview/'
          retention-days: 14
