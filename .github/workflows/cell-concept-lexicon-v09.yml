name: CELL multilingual concept lexicon v0.9 independent CI
on:
  push:
    branches: [main]
    paths:
      - '公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v0_9/**'
      - '.github/workflows/cell-concept-lexicon-v09.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild v0.8 baseline from original CELL seeds
        working-directory: 公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v0_9
        run: python src/build_v08.py
      - name: Compare five recorded MOE observations with historical seed
        working-directory: 公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v0_9
        run: python src/source_observation_v09.py
      - name: Verify all 116 regression tests and audit observations
        working-directory: 公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v0_9
        run: python -m unittest discover -s tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: CELL_Chinese_Lexicon_v09_Verified
          path: |
            公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v0_9/build/cell_concepts.sqlite3
            公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v0_9/build/observed_moe_audit_v09.json
            公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v0_9/build/manifest.json
          if-no-files-found: error
