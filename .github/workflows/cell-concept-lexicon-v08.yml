name: CELL multilingual concept lexicon v0.8 independent CI
on:
  push:
    branches: [main]
    paths:
      - '公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v0_8/**'
      - '.github/workflows/cell-concept-lexicon-v08.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild v0.8 from original v0.1-v0.7 seeds
        working-directory: 公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v0_8
        run: python src/build_v08.py
      - name: Validate 109 regressions including fail-closed evidence release
        working-directory: 公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v0_8
        run: python -m unittest discover -s tests -q
      - name: Generate independent review TSV
        working-directory: 公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v0_8
        run: python src/review_export_v08.py
      - uses: actions/upload-artifact@v4
        with:
          name: CELL_Chinese_Lexicon_v08_Verified
          path: |
            公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v0_8/build/cell_concepts.sqlite3
            公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v0_8/build/manifest.json
            公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v0_8/build/review_targets.tsv
          if-no-files-found: error
