name: CELL TaiwanKeyin verified full lexicon export

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '公開展示/cl_Taiwankeyin/AndroidMobile/tools/stage_verified_full_lexicon.py'
      - '.github/workflows/cell-taiwankeyin-full-lexicon.yml'

jobs:
  verified-lexicon:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pinned OpenCC Taiwan conversion
        run: python -m pip install 'opencc==1.4.2'
      - name: Reconstruct all 158905 verified public Chewing entries
        working-directory: '公開展示/cl_Taiwankeyin/AndroidMobile'
        run: |
          python tools/stage_verified_full_lexicon.py \
            --source-dir build/full_lexicon_source \
            --output build/full_zhuyin_mobile.sqlite3 \
            --download
      - name: Independent SQLite and provenance acceptance
        working-directory: '公開展示/cl_Taiwankeyin/AndroidMobile'
        run: |
          python - <<'PY'
          import hashlib,json,sqlite3
          from pathlib import Path
          db=Path('build/full_zhuyin_mobile.sqlite3')
          manifest=json.loads(Path('build/full_lexicon_manifest.json').read_text(encoding='utf8'))
          con=sqlite3.connect(f'file:{db.resolve()}?mode=ro',uri=True)
          try:
              actual=con.execute("SELECT COUNT(*),SUM(instr(reading,' ')>0),COUNT(DISTINCT reading) FROM lexicon_mobile").fetchone()
              assert actual==(158905,133505,121377),actual
              assert con.execute("PRAGMA integrity_check").fetchone()[0]=='ok'
              for bare,word in [('ㄋㄧ','你'),('ㄏㄠ','好'),('ㄓㄨㄥ ㄨㄣ','中文')]:
                  assert con.execute('SELECT 1 FROM lexicon_mobile WHERE bare=? AND word=?',(bare,word)).fetchone(),(bare,word)
          finally:con.close()
          digest=hashlib.sha256(db.read_bytes()).hexdigest()
          assert manifest['output_sha256']==digest
          assert manifest['source_commit']=='c44e81aef24b06f1509f19e1be54c99812d0c43f'
          print('FULL_MOBILE_LEXICON_VERIFIED',actual,db.stat().st_size,digest)
          PY
          printf '%s\n' 'The contents come from pinned upstream chewing/libchewing-data, normalized with OpenCC 1.4.2 s2twp.' 'Source metadata LGPL-2.1-or-later. See full_lexicon_manifest.json.' 'This is a reproducibly rebuilt mobile index, not a byte-for-byte copy of the private RGOS SQLite.' > build/PROVENANCE.txt
          sha256sum build/full_zhuyin_mobile.sqlite3 build/full_lexicon_manifest.json > build/SHA256SUMS.txt
      - name: Upload complete verified dictionary for Google Drive archival
        uses: actions/upload-artifact@v4
        with:
          name: cell-taiwankeyin-full-158905-android-lexicon
          path: |
            公開展示/cl_Taiwankeyin/AndroidMobile/build/full_zhuyin_mobile.sqlite3
            公開展示/cl_Taiwankeyin/AndroidMobile/build/full_lexicon_manifest.json
            公開展示/cl_Taiwankeyin/AndroidMobile/build/SHA256SUMS.txt
            公開展示/cl_Taiwankeyin/AndroidMobile/build/PROVENANCE.txt
          if-no-files-found: error
          retention-days: 14
