name: CELL multilingual concept lexicon v0.6 regression
on:
  push:
    branches: [main]
    paths:
      - '公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v0_6/**'
      - '.github/workflows/cell-concept-lexicon-v06.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild from self-curated batches
        working-directory: '公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v0_6'
        run: python src/build_v06.py
      - name: Run all 75 regressions
        working-directory: '公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v0_6'
        run: python -m unittest discover -s tests -v
      - name: Confirm zero unreviewed candidates released
        working-directory: '公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v0_6'
        run: |
          python src/review_v06.py --queue --limit 3
          python -c "import sqlite3; c=sqlite3.connect('build/cell_concepts.sqlite3'); assert c.execute('select count(*) from cell_release_candidates').fetchone()[0]==0"
      - uses: actions/upload-artifact@v4
        with:
          name: CELL_Chinese_Lexicon_v0_6_verified
          path: |
            公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v0_6/build/cell_concepts.sqlite3
            公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v0_6/build/manifest.json
