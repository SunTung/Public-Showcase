name: CELL concept lexicon v0.7 regression
on:
  push:
    branches: [main]
    paths:
      - '公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v0_7/**'
      - '.github/workflows/cell-concept-lexicon-v07.yml'
  workflow_dispatch:
jobs:
  dictionary:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build independent verified schema
        working-directory: '公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v0_7'
        run: python src/build_v07.py
      - name: Run full regression
        working-directory: '公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v0_7'
        run: python -m unittest discover -s tests -q
      - name: Check no automatic lexical approvals
        working-directory: '公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v0_7'
        run: |
          python - <<'PYCODE'
          import sqlite3
          c=sqlite3.connect('build/cell_concepts.sqlite3')
          assert c.execute('SELECT COUNT(*) FROM cell_release_v07').fetchone()[0]==0
          assert c.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          print('RELEASE GATE PASS; zero unverified candidates')
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: CELL_Chinese_Lexicon_v07_verified
          path: |
            公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v0_7/build/cell_concepts.sqlite3
            公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v0_7/build/manifest.json
          if-no-files-found: error
