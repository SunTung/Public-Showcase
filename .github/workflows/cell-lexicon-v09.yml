name: CELL lexicon v0.9 independent CI
on:
  push:
    paths:
      - '公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v0_9/**'
      - '.github/workflows/cell-lexicon-v09.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test v0.9
        working-directory: 公開展示/cl_Taiwankeyin/CELL_Chinese_Lexicon_v0_9
        run: |
          python -m unittest discover -s tests -q
          python src/build_v08.py
          python src/snapshot_audit_v09.py build/cell_concepts.sqlite3
