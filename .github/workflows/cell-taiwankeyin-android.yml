name: CELL TaiwanKeyin Android APK

on:
  push:
    branches: [main]
    paths:
      - '公開展示/cl_Taiwankeyin/AndroidMobile/**'
      - '.github/workflows/cell-taiwankeyin-android.yml'
  workflow_dispatch:

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify portable CELL phonetic and memory engine
        run: bash '公開展示/cl_Taiwankeyin/AndroidMobile/tests/run_java_tests.sh'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK (do not install obsolete SDK tools package)
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'
      - name: Install SDK 35 and platform-tools
        run: sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare Python 3.11 for full Taiwan lexicon
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned OpenCC converter
        run: python -m pip install 'opencc==1.4.2'
      - name: Stage all 158905 verified dictionary rows inside Android APK
        working-directory: '公開展示/cl_Taiwankeyin/AndroidMobile'
        run: |
          python tools/stage_verified_full_lexicon.py --download \
            --source-dir build/corpus_src \
            --output app/src/main/assets/full_zhuyin_mobile.sqlite3
          test -s app/src/main/assets/full_zhuyin_mobile.sqlite3
          test -s app/src/main/assets/full_lexicon_manifest.json
      - name: Android APK compilation
        working-directory: '公開展示/cl_Taiwankeyin/AndroidMobile'
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK and full lexicon exist
        run: |
          test -s '公開展示/cl_Taiwankeyin/AndroidMobile/app/build/outputs/apk/debug/app-debug.apk'
          test -s '公開展示/cl_Taiwankeyin/AndroidMobile/app/src/main/assets/full_zhuyin_mobile.sqlite3'
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cl-Taiwankeyin-Android-alpha4-fulllexicon-debug-apk
          path: '公開展示/cl_Taiwankeyin/AndroidMobile/app/build/outputs/apk/debug/app-debug.apk'
          retention-days: 14
