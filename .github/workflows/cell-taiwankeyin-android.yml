name: CELL TaiwanKeyin Android APK

on:
  push:
    branches: [main]
    paths:
      - '公開展示/cl_Taiwankeyin/AndroidMobile/**'
      - '.github/workflows/cell-taiwankeyin-android.yml'
  workflow_dispatch:

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify portable CELL phonetic and memory engine
        run: bash '公開展示/cl_Taiwankeyin/AndroidMobile/tests/run_java_tests.sh'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK (do not install obsolete SDK tools package)
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: 'false'
      - name: Install SDK 35 and platform-tools
        run: sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Android APK compilation
        working-directory: '公開展示/cl_Taiwankeyin/AndroidMobile'
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK exists
        run: test -s '公開展示/cl_Taiwankeyin/AndroidMobile/app/build/outputs/apk/debug/app-debug.apk'
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cl-Taiwankeyin-Android-alpha1-debug-apk
          path: '公開展示/cl_Taiwankeyin/AndroidMobile/app/build/outputs/apk/debug/app-debug.apk'
          retention-days: 14
