name: Validate public training corpus
on:
  push:
    paths:
      - 'public-training-corpus/**'
      - '.github/tests/test_public_corpus.py'
      - '.github/workflows/validate-public-corpus.yml'
  pull_request:
    paths:
      - 'public-training-corpus/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and validate published corpus only
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
              'public-training-corpus/validate_public_corpus.py',
              'public-training-corpus/fetch_public_corpus.py',
              '.github/tests/test_public_corpus.py',
          ]
          for name in files:
              compile(Path(name).read_text(encoding='utf-8'), name, 'exec')
          print('PASS: 3 Python files compile without generating .pyc')
          PY
          PYTHONDONTWRITEBYTECODE=1 python public-training-corpus/validate_public_corpus.py
          PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s .github/tests -p 'test_public_corpus.py' -v
