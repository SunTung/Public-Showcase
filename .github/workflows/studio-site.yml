name: Website validate and deploy
on:
  push:
    branches: [main, website-v1-20261111]
    paths:
      - index.html
      - assets/**
      - progress.json
      - products.json
      - portfolio.json
      - estimates.json
      - workboard.json
      - workboard-events.json
      - workboard-sync-status.json
      - workboard-gates.json
      - workboard.html
      - history/**
      - scripts/validate_site.py
      - scripts/update_workboard.py
      - scripts/reconcile_workboard.py
      - scripts/test_reconcile_workboard.py
      - .github/workflows/studio-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: studio-pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Public data allowlist and consistency
        run: python scripts/validate_site.py
      - name: Progress updater Python syntax check
        run: python -m py_compile scripts/update_workboard.py

      - name: Reconciliation unit tests (synthetic only)
        run: python -m unittest discover -s scripts -p 'test_reconcile_workboard.py' -v
      - name: Reconciliation Python syntax check
        run: python -m py_compile scripts/reconcile_workboard.py

      - name: JavaScript syntax check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for filename in ("index.html", "workboard.html"):
              html = Path(filename).read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", html, flags=re.S|re.I)
              assert scripts, "No inline scripts in " + filename
              for index, script in enumerate(scripts):
                  Path(f"/tmp/{filename}-{index}.js").write_text(script, encoding="utf-8")
          PY
          for file in /tmp/index.html-*.js /tmp/workboard.html-*.js; do node --check "$file"; done

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble public-only artifact
        run: |
          mkdir -p _site
          cp index.html workboard.html workboard.json workboard-events.json workboard-sync-status.json progress.json products.json portfolio.json estimates.json _site/
          cp -R history _site/history
          cp -R assets _site/assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
