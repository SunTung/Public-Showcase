<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Let's Go × KataGo — KW-AF Arena</title><style>*{box-sizing:border-box}body{margin:0;background:#10232c;color:#ecf2f2;font:15px system-ui}header{padding:14px;background:#1a3740}main{max-width:1050px;margin:auto;display:grid;grid-template-columns:minmax(250px,1fr) 320px;gap:12px;padding:12px}.card{background:#1a3740;border-radius:12px;padding:13px}canvas{width:100%;aspect-ratio:1;background:#c9a874;border-radius:8px}input,select,button{font:inherit;border-radius:7px;padding:9px;border:1px solid #597781;background:#0e2630;color:#fff}input[type=range]{width:100%}input[type=url],input[type=password]{width:100%}button{background:#196e57;cursor:pointer}button:disabled{opacity:.4}label{display:block;margin:10px 0}p.small{font-size:12px;color:#b4cbd0;line-height:1.5}#log{white-space:pre-wrap;max-height:250px;overflow:auto;font-size:12px}.actions{display:flex;gap:6px;flex-wrap:wrap}.warn{color:#ffd19c}a{color:#91e3b7}@media(max-width:730px){main{display:block;padding:8px}.card{margin-bottom:10px}}</style></head><body><header><b>Let's Go × KataGo</b><div style="font-size:12px">KW-AF 大範圍迷宮策略研究｜GTP 真實對局監控</div></header><main><section class="card"><canvas id="board" width="760" height="760"></canvas><p id="status">尚未連接 GTP 後端</p><p id="pending"></p><div id="log">尚未開始對局</div><p class="small">棋步由 GTP 伺服器提供。此頁不執行簡化替代 AI。</p></section><section class="card"><b>GTP 後端連線</b><label>HTTPS API 網址<input id="endpoint" type="url" placeholder="https://your-gtp-server.example"></label><label>存取權杖<input id="token" type="password" autocomplete="off" placeholder="由伺服器啟動時提供"></label><button id="connect">檢查連線</button><p class="small">GitHub Pages 是 HTTPS 網頁，必須連接具備 HTTPS 與 CORS 設定的常駐伺服器。不可直接公開無驗證的 GTP 端口；勿把權杖放在網址或公開倉庫。</p><hr><label>棋盤 <select id="size"><option value="19">19×19</option><option value="9">9×9</option></select></label><label>Let's Go 執棋 <select id="color"><option value="black">黑</option><option value="white">白</option></select></label><label>KataGo 搜尋量 <input id="visits" type="number" min="1" max="2000" value="800"></label><label>K 布局：<span id="kv">65%</span><input id="k" type="range" min="0" max="100" value="65"></label><p>W 攻防：<span id="wv">35%</span></p><label><input id="maze" type="checkbox" checked> 四步區域迷宮評分</label><div class="actions"><button id="start" disabled>啟動真實對局</button><button id="stop" disabled>停止</button></div><p id="err" class="warn"></p><a id="sgf" href="#" style="display:none">下載 SGF</a><p><a id="result" href="#" style="display:none">下載 JSON</a></p><p class="small">目前不含 LSTM 訓練或 KataGo 自動比例最佳化；此頁控制既有 KW-AF + 區域迷宮規則引擎和外部 KataGo。</p></section></main><script>
(()=>{'use strict';const $=s=>document.getElementById(s),ctx=$('board').getContext('2d'),LETTERS='ABCDEFGHJKLMNOPQRST';let connected=false,active=false,sgfReady=false;
function root(){return $('endpoint').value.trim().replace(/\/+$/,'')}function url(path){return root()+path}function show(msg){$('err').textContent=msg}
async function call(path,body){let base=root();if(!base)throw Error('請填入 HTTPS API 網址');if(location.protocol==='https:'&&!base.startsWith('https://'))throw Error('GitHub Pages 必須使用 HTTPS API');if(!/^https:\/\/[a-z0-9.-]+(?::\d+)?$/i.test(base))throw Error('API 網址格式不正確');let opt={headers:{'X-LetsGo-Token':$('token').value.trim()},cache:'no-store'};if(body!==undefined){opt.method='POST';opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body)}let r=await fetch(url(path),opt),d=await r.json();if(!r.ok)throw Error(d.error||'HTTP '+r.status);return d}
function draw(n,moves){let w=760,p=34,step=(w-2*p)/(n-1);ctx.fillStyle='#cba96f';ctx.fillRect(0,0,w,w);ctx.strokeStyle='#503a22';for(let i=0;i<n;i++){let v=p+i*step;ctx.beginPath();ctx.moveTo(p,v);ctx.lineTo(w-p,v);ctx.moveTo(v,p);ctx.lineTo(v,w-p);ctx.stroke()}let stones=Array(n*n).fill(0),nbr=i=>{let x=i%n,y=i/n|0,a=[];if(x)a.push(i-1);if(x<n-1)a.push(i+1);if(y)a.push(i-n);if(y<n-1)a.push(i+n);return a};function grp(q){let v=stones[q],seen=new Set([q]),todo=[q],libs=new Set();while(todo.length){for(let z of nbr(todo.pop())){if(!stones[z])libs.add(z);else if(stones[z]===v&&!seen.has(z)){seen.add(z);todo.push(z)}}}return {seen,libs}}
let last=-1;for(let m of moves){let a=/^([A-HJ-T])(\d+)$/.exec((m.move||'').toUpperCase());if(!a)continue;let x=LETTERS.indexOf(a[1]),y=n-Number(a[2]);if(x<0||x>=n||y<0||y>=n)continue;let q=y*n+x;stones[q]=m.color==='B'?1:2;for(let z of nbr(q)){if(stones[z]&&stones[z]!==stones[q]){let g=grp(z);if(!g.libs.size)for(let k of g.seen)stones[k]=0}}last=q}for(let q=0;q<n*n;q++)if(stones[q]){ctx.beginPath();ctx.arc(p+(q%n)*step,p+(q/n|0)*step,step*.43,0,7);ctx.fillStyle=stones[q]===1?'#171717':'#fff9ed';ctx.fill();ctx.strokeStyle='#777';ctx.stroke()}if(last>=0){ctx.beginPath();ctx.arc(p+(last%n)*step,p+(last/n|0)*step,step*.12,0,7);ctx.fillStyle='#f34c4c';ctx.fill()}}
async function refresh(){if(!connected)return;try{let d=await call('/api/status');active=!!d.active;$('start').disabled=active;$('stop').disabled=!active;let g=d.game;$('status').textContent=active?'實戰運算中':(g?.reason||'已連線、待命');$('pending').textContent=g?.pending?('等待 '+g.pending.engine+' '+g.pending.action):'';if(g){draw(g.board,g.moves||[]);$('log').textContent=(g.moves||[]).slice(-14).map(x=>x.ply+'. '+x.engine+' '+x.color+' '+x.move+' ('+x.seconds+'s)').join('\n')||'尚無落子';if(!active&&d.folder){$('sgf').style.display='inline';$('result').style.display='inline'}}show('')}catch(e){connected=false;$('start').disabled=true;$('stop').disabled=true;show('GTP 連線中斷：'+e.message)}}
async function download(path,name){let d=await fetch(url(path),{headers:{'X-LetsGo-Token':$('token').value.trim()}});if(!d.ok)throw Error('下載失敗：'+d.status);let u=URL.createObjectURL(await d.blob()),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),5000)}
$('connect').onclick=async()=>{try{let d=await call('/api/status');connected=true;show('');$('status').textContent='已連線 GTP 服務';await refresh()}catch(e){connected=false;show('無法連接：'+e.message+'。確認 HTTPS、CORS、憑證及後端服務。')}};
$('start').onclick=async()=>{try{await call('/api/start',{board:+$('size').value,color:$('color').value,visits:+$('visits').value,ratio:+$('k').value,maze:$('maze').checked});$('sgf').style.display='none';$('result').style.display='none';await refresh()}catch(e){show(e.message)}};$('stop').onclick=async()=>{if(confirm('確定停止目前的 KataGo 對局？')){try{await call('/api/stop',{});await refresh()}catch(e){show(e.message)}}};
$('k').oninput=()=>{$('kv').textContent=$('k').value+'%';$('wv').textContent=100-+$('k').value+'%'};$('sgf').onclick=e=>{e.preventDefault();download('/api/sgf','letsgo_katago.sgf').catch(x=>show(x.message))};$('result').onclick=e=>{e.preventDefault();download('/api/result','letsgo_katago.json').catch(x=>show(x.message))};draw(19,[]);setInterval(refresh,2000)})();
</script></body></html>
