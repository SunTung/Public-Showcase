<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Let's Go — Mobile KataGo Lab</title>
<style>:root{font-family:system-ui;color-scheme:dark}body{margin:0;background:#13222b;color:#e9f2f1}header,section{padding:16px}header{background:#203743}main{max-width:1000px;margin:auto;display:grid;grid-template-columns:minmax(280px,1fr) 310px;gap:12px;padding:12px}section{border-radius:14px;background:#203743}canvas{width:100%;aspect-ratio:1;background:#d8b47c;border-radius:8px}label{display:block;margin:12px 0}input,select,button{font:inherit;border-radius:8px;padding:9px;background:#122a36;color:white;border:1px solid #607783}button{cursor:pointer;background:#286d5c}a{color:#89e7ca}.note{font-size:13px;color:#bdd0d6;line-height:1.5}#log{white-space:pre-wrap;max-height:240px;overflow:auto;font-size:12px} @media(max-width:730px){main{display:block;padding:8px}section{margin-bottom:10px}} </style></head>
<body><header><h2>Let's Go × KataGo</h2><div>手機網頁研究入口｜19×19 / 9×9</div></header><main>
<section><canvas id="b" width="760" height="760"></canvas><p id="status">棋盤預覽：尚未連線到 KataGo</p><div id="log"></div></section>
<section><h3>KW-AF</h3><label>棋盤 <select id="size"><option value="19">19×19</option><option value="9">9×9</option></select></label><label>K 配置：<b id="kval">65</b>%<input id="k" type="range" min="0" max="100" value="65"></label><p>W 攻防：<b id="wval">35</b>%</p><label>KataGo visits <input id="visits" type="number" value="800" min="1" max="100000"></label><button id="save">下載設定 JSON</button><h3>SGF 棋譜回放</h3><input type="file" id="sgf" accept=".sgf,text/plain"><button id="prev">上一手</button> <button id="next">下一手</button><p id="step">0 手</p><hr><p class="note">此頁可從 GitHub 下載並在手機檢視 SGF、設定實驗參數。GitHub Pages 無法執行 KataGo 原生 CPU 引擎。實際對弈仍需要本機／雲端常駐的 GTP 伺服器，並且使用安全 HTTPS 反向代理才能從 HTTPS 網頁控制。</p></section>
</main><script>
let moves=[],ply=0,n=19;const el=x=>document.getElementById(x),c=el('b'),ctx=c.getContext('2d'),letters='ABCDEFGHJKLMNOPQRSTUVWXYZ';
function coords(x){return x.charCodeAt(0)-97}
function render(){n=+el('size').value;let w=c.width,p=35,d=(w-2*p)/(n-1);ctx.fillStyle='#d8b47c';ctx.fillRect(0,0,w,w);ctx.strokeStyle='#493820';ctx.lineWidth=2;for(let i=0;i<n;i++){let v=p+i*d;ctx.beginPath();ctx.moveTo(p,v);ctx.lineTo(w-p,v);ctx.moveTo(v,p);ctx.lineTo(v,w-p);ctx.stroke()}
let board=Array(n*n).fill(0);function nbr(q){let x=q%n,y=q/n|0,r=[];if(x)r.push(q-1);if(x<n-1)r.push(q+1);if(y)r.push(q-n);if(y<n-1)r.push(q+n);return r}
function grp(q){let v=board[q],todo=[q],seen=new Set([q]),libs=new Set();while(todo.length){for(let z of nbr(todo.pop())){if(!board[z])libs.add(z);else if(board[z]===v&&!seen.has(z)){seen.add(z);todo.push(z)}}}return {seen,libs}}
for(let t=0;t<ply;t++){let m=moves[t],s=m[1];if(!s||s.length!==2)continue;let x=coords(s[0]),y=coords(s[1]);if(x<0||y<0||x>=n||y>=n)continue;let q=y*n+x,v=m[0]==='B'?1:2;if(board[q])continue;board[q]=v;for(let z of nbr(q)){if(board[z]&&board[z]!==v){let g=grp(z);if(!g.libs.size)for(let i of g.seen)board[i]=0}}}
board.forEach((v,q)=>{if(!v)return;let x=p+(q%n)*d,y=p+(q/n|0)*d;ctx.beginPath();ctx.arc(x,y,d*.43,0,2*Math.PI);ctx.fillStyle=v===1?'#171717':'#fdfaf2';ctx.fill();ctx.strokeStyle='#777';ctx.lineWidth=1;ctx.stroke()});el('step').textContent=ply+' / '+moves.length+' 手';}
el('size').onchange=()=>{moves=[];ply=0;render()};el('k').oninput=()=>{el('kval').textContent=el('k').value;el('wval').textContent=100-+el('k').value};
el('sgf').onchange=async e=>{let f=e.target.files[0];if(!f)return;let text=await f.text(),b=/SZ\[(\d+)\]/.exec(text);if(b&&['9','19'].includes(b[1]))el('size').value=b[1];moves=[...text.matchAll(/;([BW])\[([a-z]{0,2})\]/g)].map(x=>[x[1],x[2]]);ply=0;el('status').textContent='已載入 SGF：'+f.name;render()};
el('prev').onclick=()=>{ply=Math.max(0,ply-1);render()};el('next').onclick=()=>{ply=Math.min(moves.length,ply+1);render()};
el('save').onclick=()=>{let d={board:+el('size').value,K:+el('k').value,W:100-+el('k').value,visits:+el('visits').value,maze:true};let blob=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='letsgo_kwaf_settings.json';a.click();URL.revokeObjectURL(a.href)};render();
</script></body></html>
