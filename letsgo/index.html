<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Let's Go — Mobile Practice</title>
<style>*{box-sizing:border-box}body{margin:0;background:#10252c;color:#edf4f2;font:16px system-ui}header{padding:14px;background:#1c3840}main{max-width:1100px;margin:auto;display:grid;grid-template-columns:minmax(260px,1fr) 320px;gap:12px;padding:12px}.panel{background:#1c3840;padding:14px;border-radius:14px}canvas{width:100%;aspect-ratio:1;background:#d4b078;touch-action:manipulation;border-radius:9px}button,select,input{font:inherit;border:1px solid #54747a;border-radius:9px;padding:9px;background:#123039;color:white}button{background:#24785b;cursor:pointer;margin:4px}button:disabled{opacity:.4}label{display:block;margin:12px 0}input[type=range]{width:100%}a{color:#9be2c4}.small{color:#b6cad0;font-size:13px}#log{white-space:pre-wrap;max-height:190px;overflow:auto;font-size:13px}#msg{color:#f9d6a7}@media(max-width:750px){main{display:block;padding:8px}.panel{margin-bottom:10px;padding:10px}}</style></head><body>
<header><b>Let's Go — 手機圍棋實驗室</b><div class="small">GitHub Pages：瀏覽器本機 AI 可直接執行；KataGo 需外部伺服器</div></header>
<main><section class="panel"><canvas id="board" width="740" height="740"></canvas><p id="status">按「開始本機對局」</p><p id="msg"></p><div id="log"></div></section>
<section class="panel"><b>對局模式</b><label>棋盤 <select id="size"><option value="9">9×9</option><option value="19">19×19</option></select></label><label>你執棋 <select id="color"><option value="1">黑棋</option><option value="2">白棋</option></select></label><label>AI 的 K 布局偏好：<b id="kv">65%</b><input id="k" type="range" min="0" max="100" value="65"></label><div class="small">W 攻防偏好：<b id="wv">35%</b>。本機 AI 為簡易規則評分基線，並非 KataGo 或已驗證的 KW-AF V4 完整引擎。</div>
<button id="start">開始本機對局</button><button id="pass">PASS</button><button id="undo">悔棋</button><button id="export">下載 SGF</button><hr>
<label>觀看既有棋譜 <input id="sgf" type="file" accept=".sgf"></label><button id="prev">上一手</button><button id="next">下一手</button>
<p class="small">本頁不用安裝程式即可運作，AI 直接在手機瀏覽器計算。它不能與 KataGo 800 visits 真正對抗；該功能需要另外部署受保護的 HTTPS GTP 伺服器。</p><p><a href="https://github.com/SunTung/Public-Showcase/tree/main/letsgo">GitHub 程式碼</a></p>
</section></main>
<script>
(()=>{'use strict';const E=id=>document.getElementById(id),ctx=E('board').getContext('2d'),L='ABCDEFGHJKLMNOPQRST';let n=9,b=[],turn=1,human=1,started=false,passes=0,hist=[],records=[],replay=null,replayPos=0,busy=false;const nearby=q=>{let x=q%n,y=q/n|0,a=[];if(x)a.push(q-1);if(x<n-1)a.push(q+1);if(y)a.push(q-n);if(y<n-1)a.push(q+n);return a};function group(a,q){let col=a[q],todo=[q],s=new Set([q]),libs=new Set();for(let i=0;i<todo.length;i++)for(let z of nearby(todo[i]))if(!a[z])libs.add(z);else if(a[z]===col&&!s.has(z)){s.add(z);todo.push(z)}return {s,libs}};function valid(a,t,q){if(q<0)return {board:a.slice(),captures:0};if(a[q])return null;let v=a.slice();v[q]=t,cap=0;for(let z of nearby(q))if(v[z]===3-t){let g=group(v,z);if(!g.libs.size){cap+=g.s.size;for(let i of g.s)v[i]=0}}if(!group(v,q).libs.size)return null;const key=v.join('');if(hist.some(h=>h.key===key))return null;return {board:v,captures:cap}}function record(q,res){hist.push({board:b.slice(),turn,passes,key:b.join('')});records.push({color:turn===1?'B':'W',q});b=res.board;passes=q<0?passes+1:0;turn=3-turn;draw();if(passes>=2){started=false;E('msg').textContent='雙 PASS 完局。僅顯示盤面，未經專業死活與計分審查。'}else if(turn!==human&&started)setTimeout(ai,60)}function commit(q){if(!started||busy||turn!==human)return;let r=valid(b,turn,q);if(!r){E('msg').textContent='此處不可落子（自殺、重複局面或已有棋子）。';return}E('msg').textContent='';record(q,r)}function ai(){if(!started||turn===human)return;busy=true;let best=-1e12,bq=-1,br=null,k=+E('k').value/100,occupied=[];for(let j=0;j<b.length;j++)if(b[j])occupied.push(j);for(let q=0;q<n*n;q++){if(b[q])continue;let r=valid(b,turn,q);if(!r)continue;let ne=nearby(q),friend=ne.filter(z=>b[z]===turn).length,enemy=ne.filter(z=>b[z]===human).length,lib=group(r.board,q).libs.size;let x=q%n,y=q/n,edge=Math.min(x,n-1-x,y,n-1-y),dist=occupied.length?Math.min(...occupied.map(z=>Math.abs(z%n-x)+Math.abs((z/n|0)-y))):3;let layout=(Math.min(4,dist)*.7+Math.min(edge,3)*.5),attack=enemy*1.3+friend*.5+r.captures*7;let val=k*layout+(1-k)*attack+Math.min(4,lib)*.18-Math.max(0,2-lib)*2+(Math.sin(q*78.233+records.length*21.7)*.17);if(val>best){best=val;bq=q;br=r}}if(records.length>n*n*2||best<-.5||!br){bq=-1;br=valid(b,turn,-1)}busy=false;record(bq,br)}function draw(){let a=(replay?replayBoard():b),w=740,p=32,d=(w-2*p)/(n-1);ctx.fillStyle='#d4b078';ctx.fillRect(0,0,w,w);ctx.lineWidth=2;ctx.strokeStyle='#593d21';for(let i=0;i<n;i++){let v=p+i*d;ctx.beginPath();ctx.moveTo(p,v);ctx.lineTo(w-p,v);ctx.moveTo(v,p);ctx.lineTo(v,w-p);ctx.stroke()}a.forEach((v,q)=>{if(!v)return;ctx.beginPath();ctx.arc(p+(q%n)*d,p+(q/n|0)*d,d*.43,0,7);ctx.fillStyle=v===1?'#171717':'#fff9ec';ctx.fill();ctx.lineWidth=1;ctx.strokeStyle='#777';ctx.stroke()});E('status').textContent=(replay?'回放 '+replayPos+'/'+replay.length:records.length+' 手')+'｜'+(turn===1?'黑':'白')+'棋｜'+(started?'對局中':'待命');E('log').textContent=(replay?replay.slice(Math.max(0,replayPos-12),replayPos):records.slice(-12)).map((m,i)=>(m.color+' '+(m.q<0?'PASS':L[m.q%n]+(n-(m.q/n|0))))).join('、')}function replayBoard(){let a=Array(n*n).fill(0);for(let j=0;j<replayPos;j++){let {color,q}=replay[j],t=color==='B'?1:2;if(q<0||a[q])continue;a[q]=t;for(let z of nearby(q))if(a[z]===3-t){let g=group(a,z);if(!g.libs.size)for(let u of g.s)a[u]=0}}return a}
E('start').onclick=()=>{n=+E('size').value;human=+E('color').value;b=Array(n*n).fill(0);hist=[];records=[];turn=1;passes=0;replay=null;started=true;E('msg').textContent='已開始：請在棋盤點擊交叉點落子。';draw();if(human===2)setTimeout(ai,80)};E('board').onclick=ev=>{if(replay)return;const r=E('board').getBoundingClientRect(),x=(ev.clientX-r.left)*740/r.width,y=(ev.clientY-r.top)*740/r.height,d=(740-64)/(n-1),col=Math.round((x-32)/d),row=Math.round((y-32)/d);if(col<0||col>=n||row<0||row>=n)return;if(Math.hypot(x-(32+col*d),y-(32+row*d))>d*.48)return;commit(row*n+col)};E('pass').onclick=()=>commit(-1);E('undo').onclick=()=>{if(!hist.length)return;let steps=hist.length>=2?2:1;while(steps--&&hist.length){let h=hist.pop();b=h.board;turn=h.turn;passes=h.passes;records.pop()}started=true;replay=null;draw()};E('k').oninput=()=>{E('kv').textContent=E('k').value+'%';E('wv').textContent=(100-+E('k').value)+'%'};E('export').onclick=()=>{let sg='(;GM[1]FF[4]SZ['+n+']KM[6.5]PB[Human/AI]PW[Human/AI]'+records.map(m=>';'+m.color+'['+(m.q<0?'':String.fromCharCode(97+m.q%n)+String.fromCharCode(97+(m.q/n|0)))+']').join('')+')';let url=URL.createObjectURL(new Blob([sg],{type:'application/x-go-sgf'})),a=document.createElement('a');a.href=url;a.download='letsgo_mobile_game.sgf';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};E('sgf').onchange=async ev=>{let f=ev.target.files[0];if(!f)return;let s=await f.text(),sz=/SZ\[(9|19)\]/.exec(s);if(sz)n=+sz[1];E('size').value=n;replay=[...s.matchAll(/;([BW])\[([a-z]{0,2})\]/g)].map(m=>({color:m[1],q:m[2].length===2?(m[2].charCodeAt(1)-97)*n+m[2].charCodeAt(0)-97:-1}));replayPos=0;started=false;draw()};E('prev').onclick=()=>{if(replay){replayPos=Math.max(0,replayPos-1);draw()}};E('next').onclick=()=>{if(replay){replayPos=Math.min(replay.length,replayPos+1);draw()}};draw()})();
</script></body></html>
